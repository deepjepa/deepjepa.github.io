<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepJEPA: Scaling World Models from Within</title>
  <meta name="description" content="DeepJEPA: Scaling World Models from Within. Paper and code will be released soon.">
  <style>
    :root { --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --bg: #ffffff; --accent: #111827; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f3f4f6; --muted: #9ca3af; --line: #374151; --bg: #0b0f17; --accent: #f3f4f6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--fg); padding: 32px 16px;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 720px; text-align: center; }
    h1 { font-size: clamp(2.4rem, 7vw, 3.6rem); margin: 0 0 12px; letter-spacing: -0.02em; }
    h2 { font-size: clamp(1.1rem, 3vw, 1.4rem); font-weight: 500; margin: 0 0 24px; color: var(--muted); line-height: 1.4; }
    .authors { font-size: 1.05rem; line-height: 1.7; margin: 0 0 6px; }
    .affil { font-size: 0.95rem; color: var(--muted); line-height: 1.6; margin: 0 0 4px; }
    .note { font-size: 0.85rem; color: var(--muted); margin: 0 0 32px; }
    sup { font-size: 0.7em; }
    .status { display: inline-flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 32px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 0.95rem; }
    a.button { display: inline-block; border: 1px solid var(--accent); color: var(--fg); text-decoration: none;
               border-radius: 8px; padding: 10px 18px; font-weight: 500; }
    a.button:hover { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <h1>DeepJEPA</h1>
    <h2>Scaling World Models from Within</h2>
    <p class="authors">Zijian Jin<sup>1,&dagger;</sup>, Yunbei Zhang<sup>2,&dagger;</sup>, Yuanzhe Liu<sup>3</sup>, Ming Liu<sup>4</sup>, Baian Chen<sup>5</sup>, Weirui Ye<sup>5</sup>, Shilong Liu<sup>4,6</sup>, Marco Pavone<sup>7</sup></p>
    <p class="affil"><sup>1</sup>NYU &nbsp; <sup>2</sup>Tulane &nbsp; <sup>3</sup>UIUC &nbsp; <sup>4</sup>Princeton &nbsp; <sup>5</sup>MIT &nbsp; <sup>6</sup>Columbia &nbsp; <sup>7</sup>Stanford</p>
    <p class="note"><sup>&dagger;</sup>Equal contribution</p>
    <div class="status">
      <span class="pill">Paper: coming soon</span>
      <span class="pill">Code: coming soon</span>
    </div>
    <div><a class="button" href="https://github.com/deepjepa/DeepJEPA">GitHub</a></div>
  </main>
</body>
</html>
